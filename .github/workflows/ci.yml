name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  bdd:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress Cucumber suite
        run: npm test
        env:
          CI: true
          BROWSER: chrome

      - name: Upload Cypress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: |
            reports/
            cypress/videos/
            cypress/screenshots/
          if-no-files-found: ignore
